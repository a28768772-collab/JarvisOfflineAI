name: Build JARVIS Wake Background APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create JARVIS Android Project
        run: |
          mkdir -p app/src/main/java/com/jarvis/offline
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JARVISWake"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jarvis.offline'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jarvis.offline'
                  minSdk 26
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">JARVIS</string>
              <string name="accessibility_description">JARVIS phone command control</string>
          </resources>
          EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="100"
              android:canRetrieveWindowContent="false"
              android:description="@string/accessibility_description" />
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="JARVIS"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".JarvisService"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="microphone" />

                  <service
                      android:name=".JarvisAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/jarvis/offline/JarvisAccessibilityService.java <<'EOF'
          package com.jarvis.offline;

          import android.accessibilityservice.AccessibilityService;
          import android.view.accessibility.AccessibilityEvent;

          public class JarvisAccessibilityService extends AccessibilityService {
              private static JarvisAccessibilityService instance;

              public static JarvisAccessibilityService getInstance() { return instance; }

              @Override public void onServiceConnected() { super.onServiceConnected(); instance = this; }
              @Override public void onAccessibilityEvent(AccessibilityEvent event) {}
              @Override public void onInterrupt() {}
              @Override public void onDestroy() { if (instance == this) instance = null; super.onDestroy(); }

              public boolean back() { return performGlobalAction(GLOBAL_ACTION_BACK); }
              public boolean home() { return performGlobalAction(GLOBAL_ACTION_HOME); }
              public boolean recents() { return performGlobalAction(GLOBAL_ACTION_RECENTS); }
              public boolean notifications() { return performGlobalAction(GLOBAL_ACTION_NOTIFICATIONS); }
              public boolean quickSettings() { return performGlobalAction(GLOBAL_ACTION_QUICK_SETTINGS); }
              public boolean lock() {
                  return android.os.Build.VERSION.SDK_INT >= 28 && performGlobalAction(GLOBAL_ACTION_LOCK_SCREEN);
              }
          }
          EOF

          cat > app/src/main/java/com/jarvis/offline/MainActivity.java <<'EOF'
          package com.jarvis.offline;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.provider.Settings;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import android.view.Gravity;

          public class MainActivity extends Activity {

              private static final int REQ_AUDIO = 100;
              private static final int REQ_NOTIFICATIONS = 101;

              private TextView status;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  buildScreen();

                  if (Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.RECORD_AUDIO},
                          REQ_AUDIO
                      );
                  }
              }

              private void buildScreen() {
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(40, 60, 40, 40);

                  TextView title = new TextView(this);
                  title.setText("J A R V I S");
                  title.setTextSize(34);
                  title.setGravity(Gravity.CENTER);

                  status = new TextView(this);
                  status.setText("\nJARVIS Ready\n\nTap START once.\nThen say: Hey JARVIS");
                  status.setTextSize(19);
                  status.setGravity(Gravity.CENTER);

                  Button start = new Button(this);
                  start.setText("START JARVIS");

                  Button stop = new Button(this);
                  stop.setText("STOP");

                  start.setOnClickListener(v -> startJarvis());
                  stop.setOnClickListener(v -> stopJarvis());

                  root.addView(title);
                  root.addView(status);
                  root.addView(start);
                  root.addView(control);
                  root.addView(stop);

                  setContentView(root);
              }

              private void openAccessibilitySettings() {
                  try { startActivity(new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)); } catch (Exception ignored) {}
              }

              private void startJarvis() {
                  if (Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.RECORD_AUDIO},
                          REQ_AUDIO
                      );
                      return;
                  }

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                          new String[]{Manifest.permission.POST_NOTIFICATIONS},
                          REQ_NOTIFICATIONS
                      );
                  }

                  Intent serviceIntent = new Intent(this, JarvisService.class);

                  if (Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(serviceIntent);
                  } else {
                      startService(serviceIntent);
                  }

                  status.setText(
                      "\nJARVIS ACTIVE\n\n" +
                      "Background wake is ON\n" +
                      "Say: Hey JARVIS"
                  );
              }

              private void stopJarvis() {
                  stopService(new Intent(this, JarvisService.class));
                  status.setText("\nJARVIS STOPPED\n\nTap START to run again.");
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {
                  super.onRequestPermissionsResult(
                      requestCode, permissions, grantResults
                  );

                  if (requestCode == REQ_AUDIO &&
                      grantResults.length > 0 &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED) {
                      status.setText(
                          "\nMicrophone allowed.\n\nTap START JARVIS once."
                      );
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/jarvis/offline/JarvisService.java <<'EOF'
          package com.jarvis.offline;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;

          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.Locale;

          public class JarvisService extends Service {

              private static final int NOTIFICATION_ID = 9001;
              private static final String CHANNEL_ID = "jarvis_microphone";

              private SpeechRecognizer recognizer;
              private TextToSpeech tts;
              private Handler handler;

              private boolean listening = false;
              private boolean waitingForCommand = false;
              private boolean stopping = false;

              @Override
              public void onCreate() {
                  super.onCreate();

                  handler = new Handler(getMainLooper());

                  createNotificationChannel();
                  startForegroundServiceNotification();

                  setupTTS();
                  setupRecognizer();

                  handler.postDelayed(() -> startWakeListening(), 700);
              }

              private void startForegroundServiceNotification() {
                  Intent openIntent = new Intent(this, MainActivity.class);

                  PendingIntent pendingIntent = PendingIntent.getActivity(
                      this,
                      0,
                      openIntent,
                      PendingIntent.FLAG_UPDATE_CURRENT |
                      (Build.VERSION.SDK_INT >= 23
                          ? PendingIntent.FLAG_IMMUTABLE : 0)
                  );

                  Notification.Builder builder;

                  if (Build.VERSION.SDK_INT >= 26) {
                      builder = new Notification.Builder(this, CHANNEL_ID);
                  } else {
                      builder = new Notification.Builder(this);
                  }

                  Notification notification = builder
                      .setContentTitle("JARVIS is active")
                      .setContentText("Wake word: Hey JARVIS")
                      .setSmallIcon(android.R.drawable.ic_btn_speak_now)
                      .setContentIntent(pendingIntent)
                      .setOngoing(true)
                      .build();

                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                      );
                  } else {
                      startForeground(NOTIFICATION_ID, notification);
                  }
              }

              private void createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel =
                          new NotificationChannel(
                              CHANNEL_ID,
                              "JARVIS microphone",
                              NotificationManager.IMPORTANCE_LOW
                          );

                      channel.setDescription(
                          "Keeps JARVIS ready for the wake word."
                      );

                      NotificationManager manager =
                          getSystemService(NotificationManager.class);

                      if (manager != null) {
                          manager.createNotificationChannel(channel);
                      }
                  }
              }

              private void setupTTS() {
                  tts = new TextToSpeech(this, result -> {
                      if (result == TextToSpeech.SUCCESS) {
                          tts.setLanguage(Locale.US);
                          tts.setSpeechRate(0.90f);
                      }
                  });
              }

              private void setupRecognizer() {
                  if (Build.VERSION.SDK_INT >= 31 &&
                      SpeechRecognizer.isOnDeviceRecognitionAvailable(this)) {
                      recognizer =
                          SpeechRecognizer.createOnDeviceSpeechRecognizer(this);
                  } else if (SpeechRecognizer.isRecognitionAvailable(this)) {
                      recognizer =
                          SpeechRecognizer.createSpeechRecognizer(this);
                  } else {
                      recognizer = null;
                      speak("Speech recognition is not available.");
                      return;
                  }

                  recognizer.setRecognitionListener(new RecognitionListener() {

                      @Override
                      public void onReadyForSpeech(Bundle params) {
                          listening = true;
                      }

                      @Override
                      public void onBeginningOfSpeech() {
                          listening = true;
                      }

                      @Override
                      public void onEndOfSpeech() {
                          listening = false;
                      }

                      @Override
                      public void onResults(Bundle results) {
                          listening = false;

                          ArrayList<String> matches =
                              results.getStringArrayList(
                                  SpeechRecognizer.RESULTS_RECOGNITION
                              );

                          if (matches != null && !matches.isEmpty()) {
                              handleSpeech(matches.get(0));
                          } else {
                              restartListeningSoon();
                          }
                      }

                      @Override
                      public void onError(int error) {
                          listening = false;

                          if (!stopping) {
                              restartListeningSoon();
                          }
                      }

                      @Override public void onRmsChanged(float rmsdB) {}
                      @Override public void onBufferReceived(byte[] buffer) {}
                      @Override public void onPartialResults(Bundle partialResults) {}
                      @Override public void onEvent(int eventType, Bundle params) {}
                  });
              }

              private void startWakeListening() {
                  if (stopping || recognizer == null || listening) {
                      return;
                  }

                  Intent intent = new Intent(
                      RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE,
                      Locale.getDefault()
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_PARTIAL_RESULTS,
                      false
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_PREFER_OFFLINE,
                      true
                  );

                  try {
                      recognizer.startListening(intent);
                      listening = true;
                  } catch (Exception e) {
                      listening = false;
                      restartListeningSoon();
                  }
              }

              private void restartListeningSoon() {
                  if (!stopping) {
                      handler.postDelayed(
                          this::startWakeListening,
                          waitingForCommand ? 300 : 500
                      );
                  }
              }

              private void handleSpeech(String raw) {
                  String text = normalize(raw);
                  if (text.isEmpty()) { restartListeningSoon(); return; }

                  if (containsStopCommand(text)) {
                      speak("JARVIS stopping.");
                      handler.postDelayed(this::stopJarvisService, 900);
                      return;
                  }

                  if (!waitingForCommand) {
                      if (containsWakeWord(text)) {
                          String command = removeWakeWord(text).trim();
                          if (!command.isEmpty()) {
                              executeCommand(command);
                          } else {
                              waitingForCommand = true;
                              speak("Yes?");
                              handler.postDelayed(this::startWakeListening, 900);
                          }
                      } else restartListeningSoon();
                      return;
                  }

                  waitingForCommand = false;
                  executeCommand(text);
              }

              private String normalize(String text) {
                  return text.toLowerCase(Locale.ROOT)
                      .replace("hey jarvis", "jarvis")
                      .replace("ok jarvis", "jarvis")
                      .replace("okay jarvis", "jarvis")
                      .trim();
              }

              private String removeWakeWord(String text) {
                  return text.replaceFirst("^(jarvis|जार्विस|जर्विस)[ ,:;.!-]*", "");
              }

              private boolean containsWakeWord(String text) {
                  return text.startsWith("jarvis") || text.startsWith("जार्विस") || text.startsWith("जर्विस");
              }

              private boolean containsStopCommand(String text) {
                  return (text.contains("jarvis") ||
                          text.contains("जार्विस") ||
                          text.contains("जर्विस")) &&
                         (text.contains("stop") ||
                          text.contains("स्टॉप") ||
                          text.contains("band") ||
                          text.contains("बंद") ||
                          text.contains("shutdown"));
              }

              private JarvisAccessibilityService control() {
                  return JarvisAccessibilityService.getInstance();
              }

              private boolean action(java.util.function.Supplier<Boolean> fn, String ok, String fail) {
                  JarvisAccessibilityService a = control();
                  if (a != null && fn.get()) { speak(ok); }
                  else { speak(fail); }
                  restartAfterReply();
                  return a != null;
              }

              private void executeCommand(String text) {
                  if (text.contains("back") || text.contains("पीछे") || text.contains("बैक") || text.contains("वापस") || text.contains("back karo") || text.contains("screen back")) {
                      action(() -> control().back(), "Going back.", "Phone control is OFF. Open JARVIS and enable Phone Control.");
                  } else if (text.contains("home") || text.contains("होम") || text.contains("home karo") || text.contains("घर")) {
                      action(() -> control().home(), "Going home.", "Phone control is OFF. Open JARVIS and enable Phone Control.");
                  } else if (text.contains("recent") || text.contains("recents") || text.contains("recent apps") || text.contains("रीसेंट") || text.contains("हाल के ऐप") || text.contains("पिछले ऐप")) {
                      action(() -> control().recents(), "Opening recent apps.", "Phone control is OFF. Open JARVIS and enable Phone Control.");
                  } else if (text.contains("notification") || text.contains("नोटिफिकेशन")) {
                      action(() -> control().notifications(), "Opening notifications.", "Phone control is OFF. Open JARVIS and enable Phone Control.");
                  } else if (text.contains("quick settings") || text.contains("quick panel") || text.contains("क्विक सेटिंग")) {
                      action(() -> control().quickSettings(), "Opening quick settings.", "Phone control is OFF. Open JARVIS and enable Phone Control.");
                  } else if (text.contains("lock screen") || text.contains("lock phone") || text.contains("phone lock") || text.contains("फोन लॉक") || text.contains("स्क्रीन लॉक") || text.contains("lock karo")) {
                      action(() -> control().lock(), "Locking the screen.", "Phone lock is not available right now.");
                  } else if (text.contains("settings") || text.contains("सेटिंग")) {
                      speak("Opening settings.");
                      Intent i = new Intent(android.provider.Settings.ACTION_SETTINGS);
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      try { startActivity(i); } catch (Exception ignored) {}
                      restartAfterReply();
                  } else if (text.contains("time") || text.contains("समय") || text.contains("टाइम")) {
                      String time = new SimpleDateFormat("hh:mm a", Locale.getDefault()).format(new Date());
                      speak("The time is " + time);
                      restartAfterReply();
                  } else if (text.contains("hello") || text.contains("hi") || text.contains("नमस्ते") || text.contains("हेलो")) {
                      speak("Hello. JARVIS is ready.");
                      restartAfterReply();
                  } else if (text.contains("stop listening") || text.contains("सुनना बंद")) {
                      waitingForCommand = false;
                      speak("Okay. Wake mode is still active.");
                      restartAfterReply();
                  } else {
                      speak("I don't have that phone command yet.");
                      restartAfterReply();
                  }
              }

              private void restartAfterReply() {
                  handler.postDelayed(this::startWakeListening, 1200);
              }

              private void speak(String message) {
                  if (tts != null) {
                      tts.speak(
                          message,
                          TextToSpeech.QUEUE_FLUSH,
                          null,
                          "JARVIS"
                      );
                  }
              }

              private void stopJarvisService() {
                  stopping = true;
                  listening = false;
                  waitingForCommand = false;

                  if (recognizer != null) {
                      try {
                          recognizer.cancel();
                      } catch (Exception ignored) {
                      }
                  }

                  stopForeground(STOP_FOREGROUND_REMOVE);
                  stopSelf();
              }

              @Override
              public int onStartCommand(
                      Intent intent,
                      int flags,
                      int startId) {
                  return START_NOT_STICKY;
              }

              @Override
              public void onDestroy() {
                  stopping = true;

                  if (handler != null) {
                      handler.removeCallbacksAndMessages(null);
                  }

                  if (recognizer != null) {
                      try {
                          recognizer.cancel();
                          recognizer.destroy();
                      } catch (Exception ignored) {
                      }
                      recognizer = null;
                  }

                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                      tts = null;
                  }

                  super.onDestroy();
              }

              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Wake-Background-APK
          path: app/build/outputs/apk/debug/app-debug.apk
