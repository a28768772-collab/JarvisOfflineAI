name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.11.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Check project files
        run: |
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort | head -200

      - name: Make gradlew executable
        if: ${{ hashFiles('gradlew') != '' }}
        run: chmod +x gradlew

      - name: Build JARVIS APK with Gradle wrapper
        if: ${{ hashFiles('gradlew') != '' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build JARVIS APK with installed Gradle
        if: ${{ hashFiles('gradlew') == '' && hashFiles('settings.gradle', 'settings.gradle.kts', 'build.gradle', 'build.gradle.kts') != '' }}
        run: gradle assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

      - name: Upload JARVIS APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: |
            **/build/outputs/apk/**/*.apk
            **/build/outputs/apk/*.apk
          if-no-files-found: error
