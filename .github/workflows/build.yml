package com.jarvis.offline;

import android.Manifest;
import android.app.Activity;
import android.content.Intent;
import android.content.pm.PackageManager;
import android.os.Build;
import android.os.Bundle;
import android.provider.Settings;
import android.widget.Button;
import android.widget.LinearLayout;
import android.widget.TextView;
import android.view.Gravity;

public class MainActivity extends Activity {

    private static final int REQ_AUDIO = 100;
    private static final int REQ_NOTIFICATIONS = 101;

    private TextView status;

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        buildScreen();

        if (Build.VERSION.SDK_INT >= 23 &&
            checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                != PackageManager.PERMISSION_GRANTED) {

            requestPermissions(
                new String[]{Manifest.permission.RECORD_AUDIO},
                REQ_AUDIO
            );
        }
    }

    private void buildScreen() {

        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setGravity(Gravity.CENTER);
        root.setPadding(40, 60, 40, 40);

        TextView title = new TextView(this);
        title.setText("J A R V I S");
        title.setTextSize(34);
        title.setGravity(Gravity.CENTER);

        status = new TextView(this);
        status.setText(
            "\nJARVIS Ready\n\n" +
            "Tap START once.\n" +
            "Then say: Hey JARVIS"
        );
        status.setTextSize(19);
        status.setGravity(Gravity.CENTER);

        Button start = new Button(this);
        start.setText("START JARVIS");

        Button control = new Button(this);
        control.setText("ENABLE PHONE CONTROL");

        Button stop = new Button(this);
        stop.setText("STOP");

        start.setOnClickListener(v -> startJarvis());

        control.setOnClickListener(v -> openAccessibilitySettings());

        stop.setOnClickListener(v -> stopJarvis());

        root.addView(title);
        root.addView(status);
        root.addView(start);
        root.addView(control);
        root.addView(stop);

        setContentView(root);
    }

    private void openAccessibilitySettings() {
        try {
            startActivity(
                new Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)
            );
        } catch (Exception ignored) {
        }
    }

    private void startJarvis() {

        if (Build.VERSION.SDK_INT >= 23 &&
            checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                != PackageManager.PERMISSION_GRANTED) {

            requestPermissions(
                new String[]{Manifest.permission.RECORD_AUDIO},
                REQ_AUDIO
            );
            return;
        }

        if (Build.VERSION.SDK_INT >= 33 &&
            checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                != PackageManager.PERMISSION_GRANTED) {

            requestPermissions(
                new String[]{Manifest.permission.POST_NOTIFICATIONS},
                REQ_NOTIFICATIONS
            );
        }

        Intent serviceIntent =
            new Intent(this, JarvisService.class);

        if (Build.VERSION.SDK_INT >= 26) {
            startForegroundService(serviceIntent);
        } else {
            startService(serviceIntent);
        }

        status.setText(
            "\nJARVIS ACTIVE\n\n" +
            "Background wake is ON\n" +
            "Say: Hey JARVIS"
        );
    }

    private void stopJarvis() {

        stopService(
            new Intent(this, JarvisService.class)
        );

        status.setText(
            "\nJARVIS STOPPED\n\n" +
            "Tap START to run again."
        );
    }

    @Override
    public void onRequestPermissionsResult(
            int requestCode,
            String[] permissions,
            int[] grantResults) {

        super.onRequestPermissionsResult(
            requestCode,
            permissions,
            grantResults
        );

        if (requestCode == REQ_AUDIO &&
            grantResults.length > 0 &&
            grantResults[0] == PackageManager.PERMISSION_GRANTED) {

            status.setText(
                "\nMicrophone allowed.\n\n" +
                "Tap START JARVIS once."
            );
        }
    }
}
