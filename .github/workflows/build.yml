name: Build JARVIS Offline APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Create JARVIS Android Project
        run: |
          mkdir -p app/src/main/java/com/jarvis/offline
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "JARVISOffline"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.jarvis.offline'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.jarvis.offline'
                  minSdk 26
                  targetSdk 35
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:windowBackground">#000000</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>

          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />

              <application
                  android:allowBackup="true"
                  android:label="JARVIS"
                  android:theme="@style/AppTheme"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/jarvis/offline/MainActivity.java <<'EOF'
          package com.jarvis.offline;

          import android.Manifest;
          import android.app.Activity;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.speech.tts.TextToSpeech;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {

              private TextView status;
              private TextView result;
              private TextToSpeech tts;
              private SpeechRecognizer speechRecognizer;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  buildScreen();
                  setupTTS();
                  setupSpeech();

                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                          new String[]{Manifest.permission.RECORD_AUDIO},
                          100
                      );
                  }
              }

              private void buildScreen() {

                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setPadding(40, 60, 40, 40);

                  TextView title = new TextView(this);
                  title.setText("J A R V I S");
                  title.setTextSize(34);
                  title.setGravity(Gravity.CENTER);

                  status = new TextView(this);
                  status.setText("\nOFFLINE ASSISTANT\nReady");
                  status.setTextSize(20);
                  status.setGravity(Gravity.CENTER);

                  result = new TextView(this);
                  result.setText("\nSay a command...");
                  result.setTextSize(18);
                  result.setGravity(Gravity.CENTER);

                  Button start = new Button(this);
                  start.setText("START JARVIS");

                  Button stop = new Button(this);
                  stop.setText("STOP");

                  start.setOnClickListener(v -> startListening());

                  stop.setOnClickListener(v -> {
                      if (speechRecognizer != null) {
                          speechRecognizer.stopListening();
                      }
                      status.setText("\nJARVIS\nStopped");
                  });

                  root.addView(title);
                  root.addView(status);
                  root.addView(result);
                  root.addView(start);
                  root.addView(stop);

                  setContentView(root);
              }

              private void setupTTS() {
                  tts = new TextToSpeech(this, value -> {
                      if (value == TextToSpeech.SUCCESS) {
                          tts.setLanguage(Locale.US);
                          tts.setSpeechRate(0.9f);
                      }
                  });
              }

              private void setupSpeech() {

                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      status.setText("\nSpeech recognition is not available.");
                      return;
                  }

                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);

                  speechRecognizer.setRecognitionListener(
                      new android.speech.RecognitionListener() {

                          @Override
                          public void onReadyForSpeech(Bundle params) {
                              status.setText("\nJARVIS\nListening...");
                          }

                          @Override
                          public void onBeginningOfSpeech() {
                              status.setText("\nJARVIS\nI'm listening...");
                          }

                          @Override
                          public void onEndOfSpeech() {
                              status.setText("\nJARVIS\nProcessing...");
                          }

                          @Override
                          public void onResults(Bundle results) {

                              ArrayList<String> matches =
                                  results.getStringArrayList(
                                      SpeechRecognizer.RESULTS_RECOGNITION
                                  );

                              if (matches != null && !matches.isEmpty()) {

                                  String command = matches.get(0);

                                  result.setText("\nYou said:\n" + command);

                                  handleCommand(command);
                              }
                          }

                          @Override
                          public void onError(int error) {
                              status.setText("\nJARVIS\nReady");
                          }

                          @Override public void onRmsChanged(float rmsdB) {}
                          @Override public void onBufferReceived(byte[] buffer) {}
                          @Override public void onPartialResults(Bundle partialResults) {}
                          @Override public void onEvent(int eventType, Bundle params) {}
                          @Override public void onErrorChanged(int error) {}
                      }
                  );
              }

              private void startListening() {

                  if (android.os.Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                      != PackageManager.PERMISSION_GRANTED) {

                      requestPermissions(
                          new String[]{Manifest.permission.RECORD_AUDIO},
                          100
                      );
                      return;
                  }

                  Intent intent = new Intent(
                      RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                      RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_LANGUAGE,
                      Locale.getDefault()
                  );

                  intent.putExtra(
                      RecognizerIntent.EXTRA_PARTIAL_RESULTS,
                      false
                  );

                  speechRecognizer.startListening(intent);
              }

              private void handleCommand(String command) {

                  String text = command.toLowerCase(Locale.ROOT);

                  if (text.contains("hello") ||
                      text.contains("hi") ||
                      text.contains("jarvis")) {

                      speak("Hello. JARVIS is ready.");
                      status.setText("\nJARVIS\nReady");
                  }

                  else if (text.contains("time")) {

                      String time = new java.text.SimpleDateFormat(
                          "hh:mm a",
                          Locale.getDefault()
                      ).format(new java.util.Date());

                      speak("The time is " + time);
                  }

                  else if (text.contains("settings")) {

                      speak("Opening settings.");

                      Intent settings = new Intent(
                          android.provider.Settings.ACTION_SETTINGS
                      );

                      startActivity(settings);
                  }

                  else {

                      speak("I heard you. Command received.");
                  }
              }

              private void speak(String message) {

                  if (tts != null) {
                      tts.speak(
                          message,
                          TextToSpeech.QUEUE_FLUSH,
                          null,
                          "JARVIS"
                      );
                  }
              }

              @Override
              protected void onDestroy() {

                  if (speechRecognizer != null) {
                      speechRecognizer.destroy();
                  }

                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }

                  super.onDestroy();
              }
          }
          EOF

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.11.1-bin.zip
          unzip -q gradle-8.11.1-bin.zip
          echo "$PWD/gradle-8.11.1/bin" >> "$GITHUB_PATH"

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
